<style>
        /* 变量限定在 .app 内，避免与窗口外壳的 :root 令牌（--accent / --ease 等）冲突 */
        .app {
            --bg: #0a0d14;
            --surface: #12161f;
            --surface-2: #191f2b;
            --surface-3: #222a39;
            --border: #242d3e;
            --border-2: #33405a;
            --text: #f2f5fa;
            --text-2: #8d99ad;
            --text-3: #5a6478;
            --accent: #ffd60a;
            --rose: #fb7185;
            --teal: #2dd4bf;
            --glow: 0 6px 30px rgba(255, 214, 10, .3);
            --r-md: 14px;
            --r-lg: 20px;
            --ease: .22s cubic-bezier(.4, 0, .2, 1);
        }

        .app, .app *, .app *::before, .app *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .app {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .app button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            color: inherit;
        }

        /* 铺满窗口内容区（而不是整个视口） */
        .app {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 顶栏操作（重命名为 .app-topbar，避免与外壳 .topbar 冲突） */
        .app-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            display: flex;
            justify-content: flex-end;
            padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 16px;
            pointer-events: none;
            transition: opacity .3s;
        }

        .top-btn {
            pointer-events: auto;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(18, 22, 31, .78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
            transition: transform .2s, border-color .2s;
        }

        .top-btn:hover {
            transform: scale(1.08);
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        /* 舞台与视频 */
        .theater, .stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stage {
            touch-action: pan-y;
            cursor: pointer;
        }

        .video-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .video-layer video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            background: #000;
        }

        video::-webkit-media-controls {
            display: none !important;
            opacity: 0 !important;
        }

        .video-layer.anim-up {
            animation: slideUp .26s cubic-bezier(.2, 1, .3, 1);
        }

        .video-layer.anim-down {
            animation: slideDown .26s cubic-bezier(.2, 1, .3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(60px); opacity: .3; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideDown {
            from { transform: translateY(-60px); opacity: .3; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 中心暂停徽标 */
        .pause-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.8);
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: rgba(18, 22, 31, .75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 255, 255, .2);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all .2s;
            z-index: 20;
        }

        .pause-badge.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .pause-badge svg {
            width: 32px;
            height: 32px;
            margin-left: 4px;
            fill: #fff;
        }

        /* 骨架与加载提示 */
        .skeleton {
            position: absolute;
            inset: 0;
            background: #05070c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
        }

        .spin {
            width: 44px;
            height: 44px;
            border: 3.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .85s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .skeleton .tip {
            color: var(--text-3);
            font-size: .82rem;
            letter-spacing: .05em;
        }

        /* 首次播放遮罩 */
        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 7, 12, .5);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 30;
            transition: opacity .25s;
        }

        .play-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .big-play {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd60a, #ffb703);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 36px rgba(255, 214, 10, .5);
            transition: transform .2s;
        }

        .big-play:hover { transform: scale(1.08); }
        .big-play svg { width: 32px; height: 32px; fill: #0a0d14; margin-left: 4px; }
        .play-overlay .guide { color: #fff; font-size: .88rem; font-weight: 600; text-shadow: 0 2px 8px rgba(0, 0, 0, .6); }

        /* 静音提示浮标 */
        .unmute-chip {
            position: absolute;
            top: max(68px, calc(env(safe-area-inset-top) + 60px));
            right: 16px;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px;
            border-radius: 50px;
            background: rgba(255, 214, 10, .94);
            color: #0a0d14;
            font-size: .78rem;
            font-weight: 700;
            box-shadow: var(--glow);
            transition: var(--ease);
        }

        .unmute-chip.hidden { display: none; }

        /* 清屏模式 */
        .app.clean .app-topbar, .app.clean .unmute-chip {
            opacity: 0;
            pointer-events: none;
        }

        /* 抽屉与遮罩 */
        .drawer-mask, .fav-mask {
            position: absolute;
            inset: 0;
            background: rgba(4, 6, 10, .7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s;
        }

        .drawer-mask.active, .fav-mask.active {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(390px, 88%);
            background: var(--surface);
            border-left: 1px solid var(--border);
            z-index: 110;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform .3s cubic-bezier(.2, .9, .3, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
        }

        .drawer.active { transform: translateX(0); }

        .drawer-head, .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .drawer-title, .modal-title {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .drawer-title small {
            display: block;
            font-size: .72rem;
            color: var(--text-3);
            font-weight: normal;
            margin-top: 2px;
        }

        .close-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--surface-2);
            border: 1px solid var(--border-2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-2);
            transition: var(--ease);
        }

        .close-btn:hover { color: var(--rose); border-color: var(--rose); }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
        }

        .creator-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .creator-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            transition: var(--ease);
            text-align: left;
            width: 100%;
        }

        .creator-card:hover {
            border-color: var(--border-2);
            background: var(--surface-3);
            transform: translateX(3px);
        }

        .creator-card.active {
            background: linear-gradient(135deg, rgba(255, 214, 10, .14), rgba(255, 183, 3, .06));
            border-color: rgba(255, 214, 10, .5);
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.05rem;
            flex-shrink: 0;
        }

        .cc-info {
            flex: 1;
            min-width: 0;
        }

        .cc-name {
            font-size: .9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .cc-desc {
            font-size: .7rem;
            color: var(--text-3);
            margin-top: 2px;
            display: block;
        }

        /* 收藏专线卡片 */
        .creator-card.fav-special {
            background: linear-gradient(135deg, rgba(251, 113, 133, .16), rgba(255, 214, 10, .06));
            border-color: rgba(251, 113, 133, .4);
        }

        .creator-card.fav-special.active {
            border-color: var(--rose);
            box-shadow: 0 0 16px rgba(251, 113, 133, .25);
        }

        .fav-badge {
            display: inline-block;
            padding: 1px 7px;
            font-size: .66rem;
            font-weight: 700;
            border-radius: 12px;
            background: rgba(251, 113, 133, .2);
            color: var(--rose);
            margin-left: 5px;
        }

        .fav-gallery-btn {
            padding: 4px 9px;
            border-radius: 16px;
            background: var(--surface-3);
            border: 1px solid var(--border-2);
            font-size: .72rem;
            font-weight: 600;
            transition: var(--ease);
        }

        .fav-gallery-btn:hover {
            color: var(--rose);
            border-color: var(--rose);
        }

        /* 收藏画廊模态框 */
        .fav-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.95);
            width: min(680px, 92%);
            height: min(620px, 85%);
            background: var(--surface);
            border: 1px solid var(--border-2);
            border-radius: var(--r-lg);
            z-index: 120;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .7);
            transition: all .25s ease;
            overflow: hidden;
        }

        .fav-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .fav-ops {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .op-btn {
            padding: 4px 10px;
            border-radius: 16px;
            background: var(--surface-3);
            border: 1px solid var(--border-2);
            font-size: .72rem;
            font-weight: 600;
            color: var(--text-2);
            transition: var(--ease);
        }

        .op-btn:hover { color: var(--text); border-color: var(--accent); }
        .op-btn.danger:hover { color: var(--rose); border-color: var(--rose); }

        .fav-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .fav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .fav-item {
            border-radius: var(--r-md);
            background: var(--surface-2);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform .2s, border-color .2s;
        }

        .fav-item:hover {
            transform: translateY(-2px);
            border-color: var(--border-2);
        }

        .fav-thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 9/14;
            background: #000;
            cursor: pointer;
            overflow: hidden;
        }

        .fav-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .fav-thumb-none {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: var(--surface-3);
        }

        .fav-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 2px 7px;
            border-radius: 10px;
            background: rgba(18, 22, 31, .8);
            color: var(--accent);
            font-size: .65rem;
            font-weight: 700;
        }

        .fav-item-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            border-top: 1px solid var(--border);
            background: var(--surface-2);
        }

        .foot-btn {
            font-size: .7rem;
            color: var(--text-2);
            padding: 3px 6px;
            border-radius: 4px;
            transition: var(--ease);
        }

        .foot-btn:hover { color: var(--text); }
        .foot-btn.del:hover { color: var(--rose); }

        .fav-empty {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            height: 100%;
            color: var(--text-3);
        }

        .fav-empty.show { display: flex; }
        .fav-empty-icon { font-size: 3rem; margin-bottom: 12px; }

        /* 爱心气泡动效 */
        .heart-bubble {
            position: absolute;
            width: 68px;
            height: 68px;
            margin-left: -34px;
            margin-top: -34px;
            pointer-events: none;
            z-index: 200;
            animation: heartPop .75s cubic-bezier(.2, .9, .3, 1.2) forwards;
        }

        @keyframes heartPop {
            0% { transform: scale(0) translateY(0); opacity: 0; }
            30% { transform: scale(1.2) translateY(-10px); opacity: 1; }
            100% { transform: scale(.7) translateY(-60px); opacity: 0; }
        }

        /* Toast 提示 */
        .toast {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            z-index: 300;
            padding: 10px 20px;
            border-radius: 30px;
            background: var(--surface-3);
            border: 1px solid var(--border-2);
            font-size: .82rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
            opacity: 0;
            pointer-events: none;
            transition: all .3s;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .drawer {
                top: auto;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                max-height: 75%;
                border-radius: var(--r-lg) var(--r-lg) 0 0;
                border-left: none;
                border-top: 1px solid var(--border);
                transform: translateY(100%);
            }
            .drawer.active { transform: translateY(0); }
            .fav-modal {
                top: auto;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 80%;
                border-radius: var(--r-lg) var(--r-lg) 0 0;
                transform: translateY(100%);
            }
            .fav-modal.active { transform: translateY(0); }
            .fav-grid { grid-template-columns: repeat(2, 1fr); }
            .toast { bottom: calc(140px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>

      <button class="wdot wdot-max" type="button" aria-label="展开"></button>
    </div>
    <div class="window-title">Tiktok</div>

      <button class="wbtn" type="button" data-act="expand" title="全屏">⤢</button>
    </div>
  </div>


          <div class="window-content">
            <div class="app-host" data-pagefind-ignore>
<div class="app" id="app">
        <!-- 应用内顶栏（.app-topbar，与外壳顶栏区分） -->
        <header class="app-topbar">
            <button class="top-btn" id="drawerToggle" title="全部博主/线路">💃</button>
        </header>

        <!-- 播放器剧场 -->
        <main class="theater">
            <div class="stage" id="stage">
                <div class="video-layer" id="videoLayer"></div>
                
                <!-- 抖音同款中心暂停图标 -->
                <div class="pause-badge" id="pauseBadge" title="继续播放">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>

                <!-- 加载骨架 -->
                <div class="skeleton" id="skeleton">
                    <div class="spin"></div>
                    <div class="tip" id="skeletonTip">正在获取视频…</div>
                </div>

                <!-- 首次引导遮罩 -->
                <div class="play-overlay" id="playOverlay">
                    <button class="big-play" aria-label="开始播放">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <div class="guide">点击开始 · 上下滑动 / 滚轮切换 · 双击收藏</div>
                </div>

                <!-- 静音提示 -->
                <button class="unmute-chip hidden" id="unmuteChip">
                    <span>🔇 已静音，点击开声音</span>
                </button>
            </div>
        </main>

        <!-- 抽屉侧边栏 -->
        <div class="drawer-mask" id="drawerMask"></div>
        <aside class="drawer" id="drawer">
            <div class="drawer-head">
                <div class="drawer-title">全部博主与线路<small id="drawerSub">点击即可切换线路</small></div>
                <button class="close-btn" id="drawerClose" aria-label="关闭">✕</button>
            </div>
            <div class="drawer-body">
                <div class="creator-grid" id="creatorGrid"></div>
            </div>
        </aside>

        <!-- 收藏夹弹窗 -->
        <div class="fav-mask" id="favMask"></div>
        <div class="fav-modal" id="favModal">
            <div class="modal-head">
                <div class="modal-title">❤️ 我的收藏夹 <span id="favCount" style="font-size:0.75rem;color:var(--text-3)">0部</span></div>
                <div class="fav-ops">
                    <button class="op-btn" id="favExportBtn">导出备份</button>
                    <button class="op-btn danger" id="favClearBtn">清空全部</button>
                    <button class="close-btn" id="favClose">✕</button>
                </div>
            </div>
            <div class="fav-body">
                <div class="fav-grid" id="favGrid"></div>
                <div class="fav-empty" id="favEmpty">
                    <div class="fav-empty-icon">🎬</div>
                    <div>还没有收藏任何视频</div>
                    <div style="font-size:0.75rem;margin-top:6px">播放视频时双击屏幕任意位置即可快速收藏！</div>
                </div>
            </div>
        </div>

        <!-- 极简 Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        (() => {
            /* ===================== 数据源配置 ===================== */
            const API_LIST = [
                { code: "003", title: '高质量纯妹', apiData: { api: 'http://api.yujn.cn/api/zzxjj.php?type=video', type: 'link' } },
                { code: "001", title: '黑丝', apiData: { api: 'https://api.yujn.cn/api/heisis.php?type=video', type: 'link' } },
                { code: "002", title: '萌妹短视频', apiData: { api: 'https://api.yujn.cn/api/nvda.php?type=video', type: 'link' } },
                { code: "005", title: '清纯萝莉', apiData: { api: 'http://api.yujn.cn/api/zzxjj.php?temps=', type: 'random' } },
                { code: "007", title: '快手扭一扭', apiData: { api: 'http://v.nrzj.vip/video.php?_t=', type: 'random' } },
                { code: "009", title: '妹纸', apiData: { api: 'http://v.nrzj.vip/video.php', type: 'link' } },
                { code: "010", title: '清纯', apiData: { api: 'http://api.yujn.cn/api/zzxjj.php?type=video', type: 'link' } },
                { code: "011", title: '甜妹', apiData: { api: 'http://api.yujn.cn/api/xjj.php?type=video', type: 'link' } },
                { code: "018", title: '快手女大学生', apiData: { api: 'https://api.yujn.cn/api/nvda.php?type=video', type: 'link' } },
                { code: "019", title: '黑丝系列', apiData: { api: 'http://api.yujn.cn/api/heisis.php?type=video', type: 'link' } },
                { code: "020", title: '慢摇系列', apiData: { api: 'http://api.yujn.cn/api/manyao.php?type=video', type: 'link' } },
                { code: "021", title: '吊带系列', apiData: { api: 'http://api.yujn.cn/api/diaodai.php?type=video', type: 'link' } },
                { code: "022", title: '清纯系列', apiData: { api: 'http://api.yujn.cn/api/qingchun.php?type=video', type: 'link' } },
                { code: "023", title: '女高系列', apiData: { api: 'http://api.yujn.cn/api/nvgao.php?type=video', type: 'link' } },
                { code: "024", title: '快手变装系列', apiData: { api: 'http://api.yujn.cn/api/ksbianzhuang.php?type=video', type: 'link' } },
                { code: "025", title: '甜妹系列', apiData: { api: 'http://api.yujn.cn/api/tianmei.php?type=video', type: 'link' } },
                { code: "026", title: '欲梦视频', apiData: { api: 'http://api.yujn.cn/api/ndym.php?type=video', type: 'link' } },
                { code: "027", title: '热舞视频', apiData: { api: 'http://api.yujn.cn/api/rewu.php?type=video', type: 'link' } },
                { code: "028", title: '小姐姐视频', apiData: { api: 'http://api.yujn.cn/api/ksxjjsp.php', type: 'link' } },
                { code: "031", title: '小姐姐', apiData: { api: 'https://api.cenguigui.cn/api/mp4/MP4_xiaojiejie.php', type: 'link' } },
                { code: "032", title: '高质量', apiData: { api: 'https://api.lolimi.cn/API/xjj/xjj.php', type: 'link' } },
                { code: "033", title: '随机小姐姐', apiData: { api: 'https://v2.xxapi.cn/api/meinv', data: 'data', type: 'data' } },
                { code: "034", title: '小姐姐', apiData: { api: 'https://api.dwo.cc/api/ksvideo', type: 'link' } }
            ];

            const $ = (id) => document.getElementById(id);
            const FAV_KEY = 'SHUAYA_FAVORITES_V1';
            const MM_KEY = 'MM_STATE';

            /* ===================== 状态管理 ===================== */
            const FavStorage = {
                getAll: () => { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; } },
                saveAll: (list) => { try { localStorage.setItem(FAV_KEY, JSON.stringify(list)); } catch {} },
                add: (item) => {
                    const list = FavStorage.getAll();
                    if (list.some(i => i.url.split('?')[0] === item.url.split('?')[0])) return false;
                    list.unshift(item);
                    FavStorage.saveAll(list);
                    return true;
                },
                remove: (id) => {
                    const list = FavStorage.getAll().filter(i => i.id !== id);
                    FavStorage.saveAll(list);
                    return list;
                },
                clear: () => FavStorage.saveAll([])
            };

            const getSavedApiCode = () => {
                try { return JSON.parse(localStorage.getItem(MM_KEY))?.apiCode || ''; } catch { return ''; }
            };
            const saveApiCode = (code) => {
                try { localStorage.setItem(MM_KEY, JSON.stringify({ code: "MM_STATE", apiCode: code })); } catch {}
            };

            const state = {
                currentIndex: 0,
                history: [],
                hIndex: -1,
                videoEl: null,
                loading: false,
                isMuted: false,
                isFavMode: false,
                favIndex: 0,
                userStarted: false
            };

            const savedCode = getSavedApiCode();
            if (savedCode) {
                const idx = API_LIST.findIndex(item => item.code === savedCode);
                if (idx > -1) state.currentIndex = idx;
            }

            /* ===================== 工具函数 ===================== */
            const toSecure = (url) => (window.location.protocol === 'https:' ? url.replace(/^http:\/\//i, 'https://') : url);
            const bustCache = (url) => `${url}${url.includes('?') ? '&' : '?'}_r=${Date.now()}`;

            let toastTimer = null;
            const showToast = (text) => {
                const t = $('toast');
                t.textContent = text;
                t.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
            };

            const AVATAR_COLORS = ['#ffd60a', '#fb7185', '#2dd4bf', '#a78bfa', '#60a5fa', '#f472b6'];
            const getAvatarBg = (code) => AVATAR_COLORS[parseInt(code, 10) % AVATAR_COLORS.length || 0];

            /* ===================== 视频播放引擎 ===================== */
            const createPlayer = () => {
                const v = document.createElement('video');
                v.setAttribute('playsinline', 'true');
                v.setAttribute('webkit-playsinline', 'true');
                v.setAttribute('x5-playsinline', 'true');
                v.setAttribute('x5-video-player-type', 'h5-page');
                v.playsInline = true;
                v.controls = false;
                v.loop = true;
                v.preload = 'auto';
                v.muted = state.isMuted;

                v.addEventListener('playing', () => {
                    $('skeleton').style.display = 'none';
                    $('pauseBadge').classList.remove('show');
                    // 记录 302 真实直链供历史无损回放
                    const realSrc = v.currentSrc || v.src;
                    if (state.hIndex >= 0 && state.history[state.hIndex] && realSrc) {
                        state.history[state.hIndex].url = realSrc;
                    }
                });

                v.addEventListener('pause', () => {
                    if (!state.loading && v.paused) $('pauseBadge').classList.add('show');
                });

                v.addEventListener('ended', () => {
                    v.currentTime = 0;
                    v.play().catch(() => {});
                });

                v.addEventListener('error', () => {
                    if (!state.loading && v.src) onVideoError();
                });

                $('videoLayer').innerHTML = '';
                $('videoLayer').appendChild(v);
                state.videoEl = v;
                return v;
            };

            const resolveUrl = async () => {
                if (state.isFavMode) {
                    const list = FavStorage.getAll();
                    if (!list.length) {
                        state.isFavMode = false;
                        throw new Error('收藏为空');
                    }
                    const item = list[state.favIndex % list.length];
                    state.favIndex = (state.favIndex + 1) % list.length;
                    return { url: item.url, title: item.title, code: 'FAV' };
                }

                const cur = API_LIST[state.currentIndex];
                const { api, type, data } = cur.apiData;
                let url = '';
                if (type === 'random') {
                    url = toSecure(api) + Math.random();
                } else if (type === 'link') {
                    url = bustCache(toSecure(api));
                } else {
                    const res = await fetch(bustCache(toSecure(api)));
                    let json = await res.json();
                    data.split('.').forEach(k => { json = json[k]; });
                    url = json;
                }
                return { url, title: cur.title, code: cur.code };
            };

            const safePlay = async () => {
                const v = state.videoEl;
                if (!v) return;
                try {
                    await v.play();
                    $('playOverlay').classList.add('hidden');
                    $('pauseBadge').classList.remove('show');
                } catch {
                    // 自动播放受阻降级为静音起播
                    v.muted = true;
                    state.isMuted = true;
                    try {
                        await v.play();
                        $('playOverlay').classList.add('hidden');
                        $('unmuteChip').classList.remove('hidden');
                        $('pauseBadge').classList.remove('show');
                    } catch {
                        $('playOverlay').classList.remove('hidden');
                    }
                }
            };

            const playItem = (item, dir = 'next') => {
                const v = state.videoEl || createPlayer();
                const layer = $('videoLayer');
                layer.classList.remove('anim-up', 'anim-down');
                void layer.offsetWidth;
                layer.classList.add(dir === 'prev' ? 'anim-down' : 'anim-up');

                $('skeleton').style.display = 'flex';
                $('skeletonTip').textContent = state.isFavMode ? '加载收藏视频中…' : `@${item.title} 的视频…`;
                $('pauseBadge').classList.remove('show');

                v.src = item.url;
                v.load();
                // 首次加载也直接起播：浏览器拦截有声自动播放时，safePlay 会降级为静音起播，
                // 并弹出「已静音」提示——不再需要用户先点一次遮罩才开始加载。
                safePlay();
            };

            const nextVideo = async () => {
                if (state.loading) return;
                // 若历史栈中有未来记录，直接回放前进
                if (!state.isFavMode && state.hIndex < state.history.length - 1) {
                    state.hIndex++;
                    playItem(state.history[state.hIndex], 'next');
                    return;
                }

                state.loading = true;
                $('skeleton').style.display = 'flex';
                try {
                    const item = await resolveUrl();
                    state.history.push(item);
                    state.hIndex = state.history.length - 1;
                    if (state.history.length > 50) {
                        state.history.shift();
                        state.hIndex--;
                    }
                    playItem(item, 'next');
                } catch {
                    onVideoError();
                } finally {
                    state.loading = false;
                }
            };

            const prevVideo = () => {
                if (state.hIndex <= 0) {
                    showToast('已经是第一个视频了');
                    return;
                }
                state.hIndex--;
                playItem(state.history[state.hIndex], 'prev');
            };

            const onVideoError = () => {
                $('skeleton').style.display = 'none';
                if (state.isFavMode) {
                    showToast('该收藏视频失效，正在播放下一个…');
                    setTimeout(() => nextVideo(), 1000);
                } else {
                    showToast('线路不稳定，自动换源…');
                    state.currentIndex = (state.currentIndex + 1) % API_LIST.length;
                    saveApiCode(API_LIST[state.currentIndex].code);
                    renderCreators();
                    setTimeout(() => nextVideo(), 1000);
                }
            };

            const togglePlayPause = () => {
                const v = state.videoEl;
                if (!v) return;
                if (v.paused) {
                    v.play().then(() => $('pauseBadge').classList.remove('show')).catch(() => {});
                } else {
                    v.pause();
                    $('pauseBadge').classList.add('show');
                }
            };

            /* ===================== 收藏功能 ===================== */
            const spawnHeart = (x, y) => {
                const host = $('app');
                const rect = host.getBoundingClientRect();
                const bubble = document.createElement('div');
                bubble.className = 'heart-bubble';
                /* x/y 是 clientX/clientY，转成 #app 内的绝对坐标（气泡已改为 position:absolute） */
                bubble.style.left = (x - rect.left) + 'px';
                bubble.style.top = (y - rect.top) + 'px';
                bubble.innerHTML = `<svg viewBox="0 0 24 24" fill="#fb7185"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
                host.appendChild(bubble);
                setTimeout(() => bubble.remove(), 750);
            };

            const capturePoster = (videoEl) => {
                try {
                    if (!videoEl || !videoEl.videoWidth) return '';
                    const canvas = document.createElement('canvas');
                    canvas.width = 240;
                    canvas.height = Math.round(240 * (videoEl.videoHeight / videoEl.videoWidth));
                    canvas.getContext('2d').drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                    return canvas.toDataURL('image/jpeg', 0.65);
                } catch { return ''; }
            };

            const favoriteCurrent = (x, y) => {
                if (x && y) spawnHeart(x, y);
                const v = state.videoEl;
                if (!v) return;
                const url = v.currentSrc || v.src;
                if (!url) return;

                const cur = state.isFavMode ? { title: '精选收藏', code: 'FAV' } : API_LIST[state.currentIndex];
                const ok = FavStorage.add({
                    id: 'fav_' + Date.now(),
                    url,
                    title: cur.title,
                    code: cur.code,
                    poster: capturePoster(v),
                    time: Date.now()
                });
                showToast(ok ? '❤️ 已加入我的收藏' : '❤️ 已在收藏夹中');
                renderCreators();
                if ($('favModal').classList.contains('active')) renderFavGallery();
            };

            const downloadVideo = async (url, title) => {
                showToast('正在准备下载…');
                const name = `${title || '短视频'}_${Date.now()}.mp4`;
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error();
                    const blob = await res.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = name;
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
                    showToast('🎉 下载已开始');
                } catch {
                    window.open(url, '_blank');
                    showToast('已在新窗口打开，请右键选择“视频另存为”');
                }
            };

            /* ===================== 界面渲染与抽屉 ===================== */
            const renderCreators = () => {
                const grid = $('creatorGrid');
                grid.innerHTML = '';
                const favs = FavStorage.getAll();

                // 置顶收藏卡片
                const favCard = document.createElement('div');
                favCard.className = 'creator-card fav-special' + (state.isFavMode ? ' active' : '');
                favCard.innerHTML = `
                    <span class="avatar" style="background:var(--rose)">❤️</span>
                    <span class="cc-info">
                        <span class="cc-name">我的收藏<span class="fav-badge">${favs.length}</span></span>
                        <span class="cc-desc">${state.isFavMode ? '当前正在循环播放收藏' : '点击轮播收藏 · 双击即可收藏'}</span>
                    </span>
                    <button class="fav-gallery-btn" id="openFavBtn" type="button">画廊</button>
                `;
                favCard.addEventListener('click', (e) => {
                    if (e.target.closest('#openFavBtn')) return;
                    if (!favs.length) return showToast('暂无收藏视频，双击屏幕即可收藏！');
                    state.isFavMode = true;
                    state.favIndex = 0;
                    closeDrawer();
                    renderCreators();
                    nextVideo();
                });
                favCard.querySelector('#openFavBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    closeDrawer();
                    openFavGallery();
                });
                grid.appendChild(favCard);

                // 23 条线路列表
                API_LIST.forEach((api, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'creator-card' + (!state.isFavMode && i === state.currentIndex ? ' active' : '');
                    btn.innerHTML = `
                        <span class="avatar" style="background:${getAvatarBg(api.code)}">${api.title[0]}</span>
                        <span class="cc-info">
                            <span class="cc-name">${api.title}</span>
                            <span class="cc-desc">线路 #${api.code}</span>
                        </span>
                    `;
                    btn.addEventListener('click', () => {
                        state.isFavMode = false;
                        state.currentIndex = i;
                        saveApiCode(api.code);
                        renderCreators();
                        closeDrawer();
                        nextVideo();
                    });
                    grid.appendChild(btn);
                });
            };

            const renderFavGallery = () => {
                const list = FavStorage.getAll();
                $('favCount').textContent = `${list.length} 部`;
                const grid = $('favGrid');
                grid.innerHTML = '';
                $('favEmpty').classList.toggle('show', !list.length);

                list.forEach((item, idx) => {
                    const el = document.createElement('div');
                    el.className = 'fav-item';
                    el.innerHTML = `
                        <div class="fav-thumb" title="点击播放">
                            ${item.poster ? `<img src="${item.poster}" alt="">` : `<div class="fav-thumb-none">💃</div>`}
                            <span class="fav-tag">${item.title}</span>
                        </div>
                        <div class="fav-item-foot">
                            <button class="foot-btn dl" type="button">下载</button>
                            <button class="foot-btn del" type="button">删除</button>
                        </div>
                    `;
                    el.querySelector('.fav-thumb').addEventListener('click', () => {
                        state.isFavMode = true;
                        state.favIndex = idx;
                        closeFavGallery();
                        renderCreators();
                        const favItem = { url: item.url, title: item.title, code: 'FAV' };
                        state.history.push(favItem);
                        state.hIndex = state.history.length - 1;
                        playItem(favItem, 'next');
                    });
                    el.querySelector('.foot-btn.dl').addEventListener('click', () => downloadVideo(item.url, item.title));
                    el.querySelector('.foot-btn.del').addEventListener('click', () => {
                        FavStorage.remove(item.id);
                        renderFavGallery();
                        renderCreators();
                        showToast('已移除收藏');
                    });
                    grid.appendChild(el);
                });
            };

            const openDrawer = () => { $('drawer').classList.add('active'); $('drawerMask').classList.add('active'); };
            const closeDrawer = () => { $('drawer').classList.remove('active'); $('drawerMask').classList.remove('active'); };
            const openFavGallery = () => { renderFavGallery(); $('favModal').classList.add('active'); $('favMask').classList.add('active'); };
            const closeFavGallery = () => { $('favModal').classList.remove('active'); $('favMask').classList.remove('active'); };

            /* ===================== 事件监听 ===================== */
            const bindEvents = () => {
                $('drawerToggle').addEventListener('click', openDrawer);
                $('drawerClose').addEventListener('click', closeDrawer);
                $('drawerMask').addEventListener('click', closeDrawer);
                $('favClose').addEventListener('click', closeFavGallery);
                $('favMask').addEventListener('click', closeFavGallery);

                $('playOverlay').addEventListener('click', () => {
                    state.userStarted = true;
                    safePlay();
                });

                $('pauseBadge').addEventListener('click', (e) => {
                    e.stopPropagation();
                    togglePlayPause();
                });

                $('unmuteChip').addEventListener('click', () => {
                    state.isMuted = false;
                    if (state.videoEl) {
                        state.videoEl.muted = false;
                        state.videoEl.play().catch(() => {});
                    }
                    $('unmuteChip').classList.add('hidden');
                });

                // 导出与清空收藏
                $('favExportBtn').addEventListener('click', () => {
                    const list = FavStorage.getAll();
                    if (!list.length) return showToast('暂无收藏可导出');
                    const blob = new Blob([JSON.stringify(list, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `短视频收藏_${new Date().toISOString().slice(0, 10)}.json`;
                    a.click();
                    showToast('🎉 导出成功');
                });

                $('favClearBtn').addEventListener('click', () => {
                    if (!FavStorage.getAll().length) return;
                    if (confirm('确定清空全部收藏吗？')) {
                        FavStorage.clear();
                        renderFavGallery();
                        renderCreators();
                        showToast('已清空全部收藏');
                    }
                });

                // 双击收藏 + 单击播放/暂停
                let lastTap = 0, tapTimer = null;
                $('stage').addEventListener('click', (e) => {
                    if (e.target.closest('button')) return;
                    const now = Date.now();
                    if (now - lastTap < 300) {
                        clearTimeout(tapTimer);
                        favoriteCurrent(e.clientX, e.clientY);
                        lastTap = 0;
                    } else {
                        lastTap = now;
                        tapTimer = setTimeout(() => togglePlayPause(), 260);
                    }
                });

                // 轻量手势滑动
                let touchStartY = 0, touchStartX = 0;
                $('stage').addEventListener('touchstart', (e) => {
                    touchStartY = e.touches[0].clientY;
                    touchStartX = e.touches[0].clientX;
                }, { passive: true });

                $('stage').addEventListener('touchend', (e) => {
                    const dy = e.changedTouches[0].clientY - touchStartY;
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                        // 横滑清屏模式
                        $('app').classList.toggle('clean');
                        showToast($('app').classList.contains('clean') ? '已清屏' : '已恢复');
                        return;
                    }
                    if (dy < -45) nextVideo();
                    else if (dy > 45) prevVideo();
                }, { passive: true });

                // 滚轮切换 (防抖 400ms)
                let wheelLock = false;
                $('app').addEventListener('wheel', (e) => {
                    if (wheelLock || Math.abs(e.deltaY) < 20) return;
                    if ($('drawer').classList.contains('active') || $('favModal').classList.contains('active')) return;
                    wheelLock = true;
                    setTimeout(() => { wheelLock = false; }, 400);
                    if (e.deltaY > 0) nextVideo();
                    else prevVideo();
                }, { passive: true });

                // 键盘快捷键
                document.addEventListener('keydown', (e) => {
                    const k = (e.key || '').toLowerCase();
                    if (['arrowdown', 'pagedown', ' '].includes(k) || k === 'n') { e.preventDefault(); nextVideo(); }
                    else if (['arrowup', 'pageup'].includes(k) || k === 'p') { e.preventDefault(); prevVideo(); }
                    else if (k === 'escape') { closeDrawer(); closeFavGallery(); }
                });
            };

            /* ===================== 启动 ===================== */
            const init = () => {
                createPlayer();
                renderCreators();
                bindEvents();
                nextVideo();
            };

            window.addEventListener('DOMContentLoaded', init);
        })();
    </script>
            </div>
          </div>
        </section>


      </div>
    </div>
  </div>
</div>
