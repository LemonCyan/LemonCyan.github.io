<style>
    /* ==========================================================
       所有样式完全自限作用域在 .mm-root 下，严格遵循全局不污染规范
       ========================================================== */
    .mm-root {
      --mm-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --mm-font-mono: "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace;
      
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: var(--mm-font-sans);
      user-select: none;
      box-sizing: border-box;
    }

    .mm-root *, .mm-root *::before, .mm-root *::after {
      box-sizing: inherit;
    }

    /* 深色主题配色体系 */
    .mm-root[data-theme="dark"] {
      --mm-bg: #0b0f19;
      --mm-surface: #111827;
      --mm-surface-elev: #1a2234;
      --mm-surface-hover: #222d44;
      --mm-border: rgba(255, 255, 255, 0.08);
      --mm-border-strong: rgba(255, 255, 255, 0.16);
      --mm-text: #f1f5f9;
      --mm-text-muted: #94a3b8;
      --mm-text-dim: #64748b;
      --mm-primary: #6366f1;
      --mm-primary-hover: #4f46e5;
      --mm-primary-soft: rgba(99, 102, 241, 0.16);
      --mm-primary-border: rgba(99, 102, 241, 0.35);
      --mm-success: #10b981;
      --mm-success-soft: rgba(16, 185, 129, 0.15);
      --mm-danger: #ef4444;
      --mm-danger-soft: rgba(239, 68, 68, 0.15);
      --mm-canvas-bg: #080c14;
      --mm-grid-dot: rgba(255, 255, 255, 0.06);
      --mm-editor-bg: #0f1523;
      --mm-line-num: #475569;
      --mm-line-num-bg: #0b0f19;
      --mm-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    /* 浅色主题配色体系 */
    .mm-root[data-theme="light"] {
      --mm-bg: #f8fafc;
      --mm-surface: #ffffff;
      --mm-surface-elev: #f1f5f9;
      --mm-surface-hover: #e2e8f0;
      --mm-border: rgba(0, 0, 0, 0.08);
      --mm-border-strong: rgba(0, 0, 0, 0.16);
      --mm-text: #0f172a;
      --mm-text-muted: #64748b;
      --mm-text-dim: #94a3b8;
      --mm-primary: #6366f1;
      --mm-primary-hover: #4f46e5;
      --mm-primary-soft: rgba(99, 102, 241, 0.1);
      --mm-primary-border: rgba(99, 102, 241, 0.25);
      --mm-success: #059669;
      --mm-success-soft: rgba(5, 150, 105, 0.12);
      --mm-danger: #dc2626;
      --mm-danger-soft: rgba(220, 38, 38, 0.12);
      --mm-canvas-bg: #f8fafc;
      --mm-grid-dot: rgba(0, 0, 0, 0.06);
      --mm-editor-bg: #ffffff;
      --mm-line-num: #94a3b8;
      --mm-line-num-bg: #f8fafc;
      --mm-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    /* ==================== 顶部功能工具栏 ==================== */
    .mm-topbar {
      height: 48px;
      min-height: 48px;
      background: var(--mm-surface);
      border-bottom: 1px solid var(--mm-border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      z-index: 20;
    }

    .mm-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: var(--mm-text);
      margin-right: 6px;
    }

    .mm-brand-icon {
      font-size: 18px;
      line-height: 1;
    }

    .mm-select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .mm-select {
      appearance: none;
      -webkit-appearance: none;
      background: var(--mm-surface-elev);
      color: var(--mm-text);
      border: 1px solid var(--mm-border);
      border-radius: 6px;
      padding: 5px 28px 5px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: border-color .15s, background .15s;
    }

    .mm-select:hover {
      border-color: var(--mm-border-strong);
      background: var(--mm-surface-hover);
    }

    .mm-select:focus {
      border-color: var(--mm-primary);
    }

    .mm-select-arrow {
      position: absolute;
      right: 9px;
      pointer-events: none;
      color: var(--mm-text-muted);
      width: 12px;
      height: 12px;
    }

    .mm-divider {
      width: 1px;
      height: 20px;
      background: var(--mm-border);
      margin: 0 4px;
    }

    .mm-spacer {
      flex: 1;
    }

    .mm-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--mm-border);
      background: var(--mm-surface-elev);
      color: var(--mm-text);
      cursor: pointer;
      outline: none;
      transition: all .15s ease;
      white-space: nowrap;
    }

    .mm-btn:hover {
      background: var(--mm-surface-hover);
      border-color: var(--mm-border-strong);
      color: var(--mm-text);
    }

    .mm-btn:active {
      transform: scale(0.97);
    }

    .mm-btn-primary {
      background: var(--mm-primary);
      border-color: var(--mm-primary);
      color: #ffffff;
    }

    .mm-btn-primary:hover {
      background: var(--mm-primary-hover);
      border-color: var(--mm-primary-hover);
      color: #ffffff;
    }

    .mm-icon-svg {
      width: 14px;
      height: 14px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* 下拉菜单 */
    .mm-dropdown {
      position: relative;
      display: inline-block;
    }

    .mm-menu-popover {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--mm-surface);
      border: 1px solid var(--mm-border-strong);
      border-radius: 8px;
      box-shadow: var(--mm-shadow);
      padding: 5px;
      min-width: 170px;
      z-index: 100;
      display: none;
      flex-direction: column;
      gap: 2px;
    }

    .mm-menu-popover.active {
      display: flex;
      animation: mmFadeIn .15s ease;
    }

    .mm-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      font-size: 12px;
      color: var(--mm-text);
      border-radius: 5px;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      transition: background .12s;
    }

    .mm-menu-item:hover {
      background: var(--mm-surface-hover);
      color: var(--mm-primary);
    }

    .mm-menu-desc {
      font-size: 10px;
      color: var(--mm-text-muted);
      margin-left: auto;
    }

    @keyframes mmFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==================== 双栏分屏主体 ==================== */
    .mm-workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
      background: var(--mm-bg);
    }

    /* ==================== 左侧：编辑器区域 ==================== */
    .mm-editor-pane {
      width: 44%;
      min-width: 280px;
      max-width: 80%;
      display: flex;
      flex-direction: column;
      background: var(--mm-editor-bg);
      border-right: 1px solid var(--mm-border);
      position: relative;
      z-index: 2;
    }

    /* 快捷语法插入辅助栏 */
    .mm-snippet-bar {
      padding: 6px 12px;
      background: var(--mm-surface);
      border-bottom: 1px solid var(--mm-border);
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .mm-snippet-bar::-webkit-scrollbar {
      display: none;
    }

    .mm-chip-label {
      font-size: 11px;
      color: var(--mm-text-dim);
      font-weight: 600;
      white-space: nowrap;
      margin-right: 2px;
    }

    .mm-chip {
      padding: 2px 7px;
      font-size: 11px;
      font-family: var(--mm-font-mono);
      background: var(--mm-surface-elev);
      color: var(--mm-text-muted);
      border: 1px solid var(--mm-border);
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .12s;
    }

    .mm-chip:hover {
      background: var(--mm-primary-soft);
      border-color: var(--mm-primary-border);
      color: var(--mm-primary);
    }

    /* 代码编辑器容器与行号 */
    .mm-editor-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      background: var(--mm-editor-bg);
    }

    .mm-line-numbers {
      width: 44px;
      padding: 12px 6px 12px 0;
      text-align: right;
      font-family: var(--mm-font-mono);
      font-size: 12.5px;
      line-height: 20px;
      color: var(--mm-line-num);
      background: var(--mm-line-num-bg);
      border-right: 1px solid var(--mm-border);
      user-select: none;
      overflow: hidden;
    }

    .mm-textarea {
      flex: 1;
      padding: 12px 14px;
      font-family: var(--mm-font-mono);
      font-size: 12.5px;
      line-height: 20px;
      color: var(--mm-text);
      background: transparent;
      border: none;
      resize: none;
      outline: none;
      white-space: pre;
      overflow-wrap: normal;
      overflow: auto;
      tab-size: 2;
      user-select: text;
    }

    /* 错误提示浮条 */
    .mm-error-bar {
      display: none;
      padding: 8px 12px;
      background: var(--mm-danger-soft);
      border-top: 1px solid var(--mm-danger);
      color: var(--mm-danger);
      font-size: 12px;
      line-height: 1.4;
      align-items: flex-start;
      gap: 8px;
      max-height: 90px;
      overflow-y: auto;
    }

    .mm-error-bar.active {
      display: flex;
    }

    .mm-error-text {
      flex: 1;
      font-family: var(--mm-font-mono);
      font-size: 11px;
      word-break: break-all;
    }

    /* 编辑器底栏 */
    .mm-editor-footer {
      height: 28px;
      padding: 0 12px;
      background: var(--mm-surface);
      border-top: 1px solid var(--mm-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--mm-text-muted);
    }

    /* ==================== 拖拽分割条 ==================== */
    .mm-resizer {
      width: 7px;
      cursor: col-resize;
      background: transparent;
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
      margin-left: -3px;
      margin-right: -3px;
    }

    .mm-resizer::after {
      content: "";
      width: 2px;
      height: 28px;
      border-radius: 2px;
      background: var(--mm-border-strong);
      transition: height .15s, background .15s;
    }

    .mm-resizer:hover::after,
    .mm-resizer.dragging::after {
      background: var(--mm-primary);
      height: 48px;
      width: 3px;
    }

    /* ==================== 右侧：实时渲染画布 ==================== */
    .mm-preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--mm-canvas-bg);
    }

    /* 画布视口背景网格 */
    .mm-canvas-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background-color: var(--mm-canvas-bg);
      background-image: radial-gradient(var(--mm-grid-dot) 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }

    .mm-canvas-viewport:active {
      cursor: grabbing;
    }

    /* 图表缩放位移容器 */
    .mm-canvas-stage {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      pointer-events: auto;
      will-change: transform;
      padding: 40px;
    }

    .mm-canvas-stage svg {
      display: block;
      max-width: none !important;
      height: auto !important;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
    }

    /* 悬浮操作控制条 */
    .mm-floating-controls {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--mm-surface);
      border: 1px solid var(--mm-border-strong);
      box-shadow: var(--mm-shadow);
      border-radius: 8px;
      padding: 4px;
      z-index: 15;
    }

    .mm-zoom-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 5px;
      color: var(--mm-text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background .12s, color .12s;
    }

    .mm-zoom-btn:hover {
      background: var(--mm-surface-hover);
      color: var(--mm-primary);
    }

    .mm-zoom-indicator {
      font-size: 11px;
      font-family: var(--mm-font-mono);
      color: var(--mm-text-muted);
      padding: 0 6px;
      min-width: 44px;
      text-align: center;
    }

    /* 渲染状态标记（右上角） */
    .mm-status-pill {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--mm-surface);
      border: 1px solid var(--mm-border);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      color: var(--mm-text-muted);
      box-shadow: var(--mm-shadow);
      z-index: 12;
      pointer-events: none;
    }

    .mm-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mm-success);
    }

    .mm-status-pill.error .mm-status-dot {
      background: var(--mm-danger);
    }

    .mm-status-pill.rendering .mm-status-dot {
      background: var(--mm-primary);
      animation: mmPulse 1s infinite;
    }

    @keyframes mmPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* 操作提示浮窗 (Toast) */
    .mm-toast {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--mm-surface-elev);
      color: var(--mm-text);
      border: 1px solid var(--mm-border-strong);
      box-shadow: var(--mm-shadow);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: all .2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mm-toast.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 隐藏的辅助渲染节点 */
    #mm-hidden-sandbox {
      position: absolute;
      top: -9999px;
      left: -9999px;
      visibility: hidden;
      pointer-events: none;
      width: 1000px;
      height: 1000px;
    }

    /* 响应式适配 */
    @media (max-width: 720px) {
      .mm-workspace {
        flex-direction: column;
      }
      .mm-editor-pane {
        width: 100% !important;
        height: 48%;
        max-width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--mm-border);
      }
      .mm-resizer {
        display: none;
      }
      .mm-preview-pane {
        width: 100% !important;
        height: 52%;
      }
    }
  </style>
</head>

        sequence: `sequenceDiagram
    autonumber
    actor User as 👤 客户端用户
    participant App as 📱 前端应用
    participant Gateway as 🚪 API 网关
    participant Auth as 🔐 鉴权服务
    participant DB as 🗄️ 用户凭证库

    User->>App: 输入用户名与密码登录
    App->>Gateway: POST /api/v1/auth/login
    Gateway->>Auth: 转发登录鉴权请求
    Auth->>DB: 查询用户凭证与 Salt
    DB-->>Auth: 返回加密哈希密码
    
    alt 凭证匹配成功
        Auth->>Auth: 签发 AccessToken (15m) 与 RefreshToken (7d)
        Auth-->>Gateway: 鉴权通过，返回双 Token 密钥对
        Gateway-->>App: 200 OK (设置 HttpOnly Cookie)
        App-->>User: 登录成功，跳转至主仪表盘
    else 密码错误或账户冻结
        Auth-->>Gateway: 抛出 401 Unauthorized 异常
        Gateway-->>App: 返回标准错误 JSON
        App-->>User: 界面摇晃提示「账号或密码不匹配」

        quadrant_chart: `quadrantChart
    title 需求优先级与价值ROI四象限评估
    x-axis 研发成本投入 (低 --> 高)
    y-axis 预期业务价值 (低 --> 高)
    quadrant-1 战略攻坚核心 (高价值/高成本)
    quadrant-2 高性价比明星 (高价值/低成本)
    quadrant-3 待斟酌观察区 (低价值/低成本)
    quadrant-4 资源黑洞慎入 (低价值/高成本)
    "快捷 Mermaid 图表导出": [0.25, 0.85]

    "小众复杂图表语法扩展": [0.78, 0.22]`
      };

      // ============================================================
      // DOM 元素引用
      // ============================================================
      var ROOT = document.getElementById('mmAppRoot');
      var codeInput = document.getElementById('mmCodeInput');
      var lineNumbers = document.getElementById('mmLineNumbers');
      var canvasViewport = document.getElementById('mmCanvasViewport');
      var canvasStage = document.getElementById('mmCanvasStage');
      var templateSelect = document.getElementById('mmTemplateSelect');
      var themeSelect = document.getElementById('mmThemeSelect');
      var errorBar = document.getElementById('mmErrorBar');
      var errorText = document.getElementById('mmErrorText');
      var statsLine = document.getElementById('mmStatsLine');
      var statusPill = document.getElementById('mmStatusPill');
      var statusText = document.getElementById('mmStatusText');
      var zoomVal = document.getElementById('mmZoomVal');
      var toastEl = document.getElementById('mmToast');
      var toastMsg = document.getElementById('mmToastMsg');
      var exportMenuBtn = document.getElementById('mmBtnExportMenu');
      var exportPopover = document.getElementById('mmExportPopover');
      var resizer = document.getElementById('mmResizer');
      var editorPane = document.getElementById('mmEditorPane');
      var workspace = document.getElementById('mmWorkspace');
      var hiddenSandbox = document.getElementById('mm-hidden-sandbox');

      // 本地持久化 Key
      var STORAGE_KEY_CODE = 'mm_editor_content_v1';
      var STORAGE_KEY_THEME = 'mm_mermaid_theme_v1';
      var STORAGE_KEY_WIDTH = 'mm_editor_pane_width_v1';

      // ============================================================
      // 画布变换状态（缩放 + 平移）
      // ============================================================
      var zoom = 1.0;
      var panX = 0;
      var panY = 0;
      var isPanning = false;
      var panStartX = 0;
      var panStartY = 0;
      var panStartTransX = 0;
      var panStartTransY = 0;

      // 渲染防抖定时器
      var renderTimer = null;
      var currentRenderId = 0;
      var lastValidSvg = '';

      // ============================================================
      // 消息提示组件
      // ============================================================
      var toastTimer = null;
      function showToast(msg) {
        toastMsg.textContent = msg;
        toastEl.classList.add('active');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('active');
        }, 2200);
      }

      // ============================================================
      // 站点与应用主题适配
      // ============================================================
      function getSiteScheme() {
        var s = String(document.body.getAttribute('data-scheme') || '').toLowerCase();
        if (s === 'light' || s === 'dark') return s;
        try {
          var saved = localStorage.getItem('site-scheme');
          if (saved === 'light' || saved === 'dark') return saved;
        } catch (e) {}
        return 'dark';
      }

      function updateRootTheme() {
        var scheme = getSiteScheme();
        ROOT.setAttribute('data-theme', scheme);
        return scheme;
      }

      // 监听全局站点顶栏主题切换
      if (typeof MutationObserver !== 'undefined') {
        new MutationObserver(function () {
          updateRootTheme();
          if (themeSelect.value === 'auto') {
            scheduleRender(50);
          }
        }).observe(document.body, { attributes: true, attributeFilter: ['data-scheme'] });
      }

      // ============================================================
      // 编辑器行号与统计更新
      // ============================================================
      function updateEditorStats() {
        var val = codeInput.value;
        var lines = val.split('\n');
        var lineCount = lines.length;
        var charCount = val.length;

        statsLine.textContent = lineCount + ' 行 · ' + charCount + ' 字符';

        // 生成行号
        var numsHtml = [];
        for (var i = 1; i <= lineCount; i++) {
          numsHtml.push(i);
        }
        lineNumbers.textContent = numsHtml.join('\n');
      }

      // 滚动同步
      codeInput.addEventListener('scroll', function () {
        lineNumbers.scrollTop = codeInput.scrollTop;
      });

      // Tab 键智能缩进 2 空格
      codeInput.addEventListener('keydown', function (e) {
        if (e.key === 'Tab') {
          e.preventDefault();
          var start = codeInput.selectionStart;
          var end = codeInput.selectionEnd;
          var val = codeInput.value;
          codeInput.value = val.substring(0, start) + '  ' + val.substring(end);
          codeInput.selectionStart = codeInput.selectionEnd = start + 2;
          updateEditorStats();
          scheduleRender(300);
        }
      });

      // ============================================================
      // Mermaid 渲染引擎核心
      // ============================================================
      function getActiveMermaidTheme() {
        var choice = themeSelect.value;
        if (choice === 'auto') {
          var scheme = getSiteScheme();
          return scheme === 'dark' ? 'dark' : 'default';
        }
        return choice;
      }

      function setStatus(status, text) {
        statusPill.className = 'mm-status-pill ' + (status || '');
        statusText.textContent = text;
      }

      function scheduleRender(delay) {
        if (renderTimer) clearTimeout(renderTimer);
        renderTimer = setTimeout(function () {
          doRender();
        }, delay !== undefined ? delay : 250);
      }

      async function doRender() {
        var code = codeInput.value.trim();
        if (!code) {
          canvasStage.innerHTML = '<div style="padding:40px;color:var(--mm-text-muted);font-size:14px;text-align:center;">👈 请在左侧粘贴或输入 Mermaid 代码，图表将自动生成</div>';
          errorBar.classList.remove('active');
          setStatus('', '等待输入');
          return;
        }

        if (typeof mermaid === 'undefined') {
          setStatus('error', '引擎加载中');
          return;
        }

        var reqId = ++currentRenderId;
        setStatus('rendering', '正在渲染…');

        var currentTheme = getActiveMermaidTheme();

        try {
          mermaid.initialize({
            startOnLoad: false,
            theme: currentTheme,
            securityLevel: 'loose',
            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
            logLevel: 'error',
            flowchart: {
              htmlLabels: true,
              useMaxWidth: false,
              curve: 'basis'
            },
            sequence: {
              useMaxWidth: false
            },
            gantt: {
              useMaxWidth: false
            }
          });

          // 先尝试 parse，语法无误再 render
          if (typeof mermaid.parse === 'function') {
            await mermaid.parse(code);
          }

          var renderUid = 'mm-diag-' + Date.now();
          var result = await mermaid.render(renderUid, code);

          if (reqId !== currentRenderId) return;

          lastValidSvg = result.svg;
          canvasStage.innerHTML = result.svg;
          errorBar.classList.remove('active');
          setStatus('', '渲染就绪');

          // 若初次加载且图表未定位，自动自适应居中
          if (zoom === 1.0 && panX === 0 && panY === 0) {
            fitViewToScreen();
          }

          // 本地自动保存草稿
          try {
            localStorage.setItem(STORAGE_KEY_CODE, code);
          } catch (e) {}

        } catch (err) {
          if (reqId !== currentRenderId) return;
          console.warn('Mermaid 渲染抛出语法提示:', err);
          
          var msg = err.message || String(err);
          // 清理多余的前缀
          msg = msg.replace(/^Error:\s*/i, '');
          errorText.textContent = msg;
          errorBar.classList.add('active');
          setStatus('error', '语法有误');

          // 清理 Mermaid 偶尔在 body 末尾遗留的临时报错 DOM
          var leak = document.querySelectorAll('div[id^="dmm-diag-"], svg[id^="mm-diag-"]');
          leak.forEach(function (el) {
            if (el.parentNode && el.parentNode !== canvasStage) {
              el.remove();
            }
          });
        }
      }

      // ============================================================
      // 画布交互：无限平移与缩放 (Pan & Zoom)
      // ============================================================
      function applyCanvasTransform() {
        canvasStage.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoom + ')';
        zoomVal.textContent = Math.round(zoom * 100) + '%';
      }

      // 鼠标拖拽平移
      canvasViewport.addEventListener('mousedown', function (e) {
        if (e.target.closest('.mm-floating-controls') || e.target.closest('.mm-status-pill')) return;
        isPanning = true;
        panStartX = e.clientX;
        panStartY = e.clientY;
        panStartTransX = panX;
        panStartTransY = panY;
      });

      window.addEventListener('mousemove', function (e) {
        if (!isPanning) return;
        panX = panStartTransX + (e.clientX - panStartX);
        panY = panStartTransY + (e.clientY - panStartY);
        applyCanvasTransform();
      });

      window.addEventListener('mouseup', function () {
        isPanning = false;
      });

      // 滚轮缩放（以鼠标光标所在点为焦点）
      canvasViewport.addEventListener('wheel', function (e) {
        e.preventDefault();
        var rect = canvasViewport.getBoundingClientRect();
        var mouseX = e.clientX - rect.left;
        var mouseY = e.clientY - rect.top;

        var zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
        var newZoom = Math.min(Math.max(zoom * zoomFactor, 0.1), 10);

        // 调整平移量使得光标点位置保持不变
        panX = mouseX - (mouseX - panX) * (newZoom / zoom);
        panY = mouseY - (mouseY - panY) * (newZoom / zoom);
        zoom = newZoom;

        applyCanvasTransform();
      }, { passive: false });

      // 缩放按钮
      document.getElementById('mmZoomIn').addEventListener('click', function () {
        var rect = canvasViewport.getBoundingClientRect();
        var cx = rect.width / 2;
        var cy = rect.height / 2;
        var newZoom = Math.min(zoom * 1.25, 10);
        panX = cx - (cx - panX) * (newZoom / zoom);
        panY = cy - (cy - panY) * (newZoom / zoom);
        zoom = newZoom;
        applyCanvasTransform();
      });

      document.getElementById('mmZoomOut').addEventListener('click', function () {
        var rect = canvasViewport.getBoundingClientRect();
        var cx = rect.width / 2;
        var cy = rect.height / 2;
        var newZoom = Math.max(zoom * 0.8, 0.1);
        panX = cx - (cx - panX) * (newZoom / zoom);
        panY = cy - (cy - panY) * (newZoom / zoom);
        zoom = newZoom;
        applyCanvasTransform();
      });

      document.getElementById('mmZoomReset').addEventListener('click', function () {
        zoom = 1.0;
        panX = 40;
        panY = 40;
        applyCanvasTransform();
      });

      function fitViewToScreen() {
        var svg = canvasStage.querySelector('svg');
        if (!svg) return;

        var vRect = canvasViewport.getBoundingClientRect();
        var sRect = svg.getBoundingClientRect();

        var w = (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width) || sRect.width / zoom || 600;
        var h = (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.height) || sRect.height / zoom || 400;

        var padding = 60;
        var availW = Math.max(vRect.width - padding * 2, 80);
        var availH = Math.max(vRect.height - padding * 2, 80);

        var fitZoom = Math.min(availW / w, availH / h, 1.8);
        zoom = Math.max(fitZoom, 0.15);

        panX = (vRect.width - w * zoom) / 2;
        panY = (vRect.height - h * zoom) / 2;

        applyCanvasTransform();
      }

      document.getElementById('mmZoomFit').addEventListener('click', fitViewToScreen);

      // ============================================================
      // 快捷语法插入辅助
      // ============================================================
      document.querySelectorAll('.mm-chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
          var snippet = chip.getAttribute('data-insert') || '';
          if (!snippet) return;

          var start = codeInput.selectionStart;
          var end = codeInput.selectionEnd;
          var val = codeInput.value;

          codeInput.value = val.substring(0, start) + snippet + val.substring(end);
          var newPos = start + snippet.length;
          codeInput.selectionStart = codeInput.selectionEnd = newPos;
          codeInput.focus();

          updateEditorStats();
          scheduleRender(200);
        });
      });

      // 文本变更监听
      codeInput.addEventListener('input', function () {
        updateEditorStats();
        scheduleRender(250);
      });

      // 模板选择切换
      templateSelect.addEventListener('change', function () {
        var key = templateSelect.value;
        if (key && TEMPLATES[key]) {
          codeInput.value = TEMPLATES[key];
          updateEditorStats();
          zoom = 1.0; panX = 0; panY = 0;
          scheduleRender(50);
          showToast('已加载示例模板');
        }
      });

      // 主题选择切换
      themeSelect.addEventListener('change', function () {
        try {
          localStorage.setItem(STORAGE_KEY_THEME, themeSelect.value);
        } catch (e) {}
        scheduleRender(50);
      });

      // 复制源码
      document.getElementById('mmBtnCopyCode').addEventListener('click', function () {
        var code = codeInput.value;
        if (!code) {
          showToast('编辑器内容为空');
          return;
        }
        navigator.clipboard.writeText(code).then(function () {
          showToast('✅ Mermaid 源码已复制到剪贴板');
        }).catch(function () {
          showToast('复制受限，请手动全选复制');
        });
      });

      // 清空
      document.getElementById('mmBtnClear').addEventListener('click', function () {
        if (!codeInput.value) return;
        if (confirm('确认清空当前编辑器内容吗？')) {
          codeInput.value = '';
          updateEditorStats();
          scheduleRender(0);
          showToast('已清空');
        }
      });

      // ============================================================
      // 导出与分享机制 (PNG, SVG, Clipboard)
      // ============================================================
      exportMenuBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        exportPopover.classList.toggle('active');
      });

      document.addEventListener('click', function () {
        exportPopover.classList.remove('active');
      });

      function getCleanSvgString() {
        var svg = canvasStage.querySelector('svg');
        if (!svg) return null;
        var clone = svg.cloneNode(true);
        clone.removeAttribute('style');
        return new XMLSerializer().serializeToString(clone);
      }

      // 导出 SVG 矢量图
      document.getElementById('mmExportSVG').addEventListener('click', function () {
        var svgStr = getCleanSvgString();
        if (!svgStr) {
          showToast('图表未生成，无法导出');
          return;
        }
        var blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'mermaid-diagram-' + Date.now() + '.svg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('✅ SVG 矢量文件已下载');
      });

      // 复制 SVG 源码
      document.getElementById('mmCopySVG').addEventListener('click', function () {
        var svgStr = getCleanSvgString();
        if (!svgStr) {
          showToast('图表未生成');
          return;
        }
        navigator.clipboard.writeText(svgStr).then(function () {
          showToast('✅ SVG 代码已复制到剪贴板');
        }).catch(function () {
          showToast('复制受阻');
        });
      });

      // 导出与复制 PNG 通用渲染器
      function renderSvgToCanvas(scale, callback) {
        var svg = canvasStage.querySelector('svg');
        if (!svg) {
          showToast('图表未生成');
          return;
        }

        var sRect = svg.getBoundingClientRect();
        var vb = svg.viewBox && svg.viewBox.baseVal;
        var w = (vb && vb.width) || sRect.width / zoom || 800;
        var h = (vb && vb.height) || sRect.height / zoom || 600;

        var svgStr = new XMLSerializer().serializeToString(svg);
        var blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var img = new Image();

        img.onload = function () {
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(w * scale);
          canvas.height = Math.round(h * scale);
          var ctx = canvas.getContext('2d');

          // 背景填充匹配当前图表方案
          var scheme = getSiteScheme();
          var isDark = getActiveMermaidTheme() === 'dark' || (getActiveMermaidTheme() === 'default' && scheme === 'dark');
          ctx.fillStyle = isDark ? '#0b0f19' : '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);

          callback(canvas);
        };

        img.onerror = function () {
          URL.revokeObjectURL(url);
          showToast('图片合成失败');
        };

        img.src = url;
      }

      // 导出 PNG
      document.getElementById('mmExportPNG2x').addEventListener('click', function () {
        renderSvgToCanvas(2.0, function (canvas) {
          canvas.toBlob(function (blob) {
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'mermaid-chart-' + Date.now() + '.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('✅ 高清 PNG 图片已下载');
          }, 'image/png');
        });
      });

      // 复制 PNG 图片到系统剪贴板
      document.getElementById('mmCopyPNG').addEventListener('click', function () {
        renderSvgToCanvas(2.0, function (canvas) {
          canvas.toBlob(function (blob) {
            if (navigator.clipboard && window.ClipboardItem) {
              navigator.clipboard.write([
                new ClipboardItem({ 'image/png': blob })
              ]).then(function () {
                showToast('✅ 图片已复制到剪贴板！可直接 Ctrl+V 粘贴');
              }).catch(function (err) {
                console.warn(err);
                showToast('浏览器权限限制，已转为下载 PNG');
                // 降级为下载
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'mermaid-chart.png';
                a.click();
              });
            } else {
              showToast('当前环境不支持直接写入剪贴板图片');
            }
          }, 'image/png');
        });
      });

      // ============================================================
      // 栏目自由调整拖拽 (Resizer)
      // ============================================================
      var isResizing = false;
      resizer.addEventListener('mousedown', function (e) {
        isResizing = true;
        resizer.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
      });

      window.addEventListener('mousemove', function (e) {
        if (!isResizing) return;
        var totalW = workspace.getBoundingClientRect().width;
        var newW = e.clientX - workspace.getBoundingClientRect().left;
        var pct = (newW / totalW) * 100;
        if (pct >= 20 && pct <= 80) {
          editorPane.style.width = pct + '%';
          try {
            localStorage.setItem(STORAGE_KEY_WIDTH, pct);
          } catch (e) {}
        }
      });

      window.addEventListener('mouseup', function () {
        if (isResizing) {
          isResizing = false;
          resizer.classList.remove('dragging');
          document.body.style.cursor = '';
        }
      });

      // 双击分割线复位 44%
      resizer.addEventListener('dblclick', function () {
        editorPane.style.width = '44%';
        try {
          localStorage.setItem(STORAGE_KEY_WIDTH, '44');
        } catch (e) {}
        showToast('分屏比例已复位');
      });

      // ============================================================
      // 初始化启动逻辑
      // ============================================================
      function init() {
        updateRootTheme();

        // 恢复分屏宽度
        try {
          var savedW = localStorage.getItem(STORAGE_KEY_WIDTH);
          if (savedW && Number(savedW) >= 20 && Number(savedW) <= 80) {
            editorPane.style.width = savedW + '%';
          }
        } catch (e) {}

        // 恢复图表主题选择
        try {
          var savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
          if (savedTheme) themeSelect.value = savedTheme;
        } catch (e) {}

        // 恢复用户保存的代码或默认展示基础审批流模板
        var initCode = TEMPLATES.flowchart_std;
        try {
          var savedCode = localStorage.getItem(STORAGE_KEY_CODE);
          if (savedCode && savedCode.trim()) {
            initCode = savedCode;
          }
        } catch (e) {}

        codeInput.value = initCode;
        updateEditorStats();

        // 等待 Mermaid 加载完成后首次渲染
        function checkAndRender() {
          if (typeof mermaid !== 'undefined') {
            doRender();
          } else {
            setTimeout(checkAndRender, 60);
          }
        }
        checkAndRender();
      }

      init();

    })();
  </script>
            </div>
          </div>
        </section>


      </div>
    </div>
  </div>
</div>
